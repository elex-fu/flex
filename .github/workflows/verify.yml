name: Verify

# PR + push to main: install, native rebuild, typecheck, unit/integration tests.
# Design doc §5.8 (CI、测试报告与失败工件): PR-stage gate for the monorepo.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Reads the pinned version from package.json `packageManager` (pnpm@11.17.0).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 24 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # better-sqlite3 is a native module; ensure it matches the CI Node ABI.
      - name: Rebuild better-sqlite3 for the current Node ABI
        run: pnpm rebuild better-sqlite3

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit & integration tests
        run: pnpm test
